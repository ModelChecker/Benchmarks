# This file was generated by Cursor AI on 2026-10-20.
name: Sort-check MoXI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  sortcheck:
    name: Sort-check with moxisc
    runs-on: ubuntu-latest
    env:
      YICES_VERSION: "2.7.0"
      YICES_PREFIX: ${{ github.workspace }}/.yices
    steps:
      - name: Checkout Benchmarks
        uses: actions/checkout@v4

      - name: Checkout moxi-tools
        uses: actions/checkout@v4
        with:
          repository: ModelChecker/moxi-tools
          path: moxi-tools

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gperf python3 autoconf gcc make libgmp-dev

      - name: Cache Yices
        id: cache-yices
        uses: actions/cache@v4
        with:
          path: ${{ env.YICES_PREFIX }}
          key: yices-${{ env.YICES_VERSION }}-src-${{ runner.os }}-${{ runner.arch }}

      - name: Build Yices
        if: steps.cache-yices.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/SRI-CSL/yices2.git yices2-src
          git -C yices2-src checkout "yices-${YICES_VERSION}"
          (
            cd yices2-src
            autoconf
            ./configure --prefix="$YICES_PREFIX"
            make -j"$(nproc)"
            make install
          )
          rm -rf yices2-src

      - name: Configure Yices environment
        run: |
          echo "$YICES_PREFIX/bin" >> "$GITHUB_PATH"
          echo "C_INCLUDE_PATH=$YICES_PREFIX/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$YICES_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$YICES_PREFIX/lib -Wl,-rpath,$YICES_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Get moxi-tools revision
        id: moxi-tools
        run: echo "sha=$(git -C moxi-tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache moxisc
        id: cache-moxisc
        uses: actions/cache@v4
        with:
          path: moxi-tools/build/moxisc
          key: moxisc-${{ steps.moxi-tools.outputs.sha }}-yices-${{ env.YICES_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build moxisc
        if: steps.cache-moxisc.outputs.cache-hit != 'true'
        working-directory: moxi-tools
        run: make -j"$(nproc)"

      - name: Sort-check all MoXI files
        env:
          MOXISC: ${{ github.workspace }}/moxi-tools/build/moxisc
        run: bash scripts/sortcheck.sh
